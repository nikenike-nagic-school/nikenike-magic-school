<!DOCTYPE html>
 <html lang="zh-CN">
 <head>
   <meta charset="UTF-8">
   <title>魔法登录</title>
   <style>
     body {
       background: #0b0b1a;
       color: #ffdd77;
       text-align: center;
       padding-top: 60px;
     }
     input {
       width: 260px;
       padding: 10px;
       margin: 8px;
       font-size: 16px;
     }
     button {
       padding: 12px 26px;
       background: #222;
       color: #ffdd77;
       border: 1px solid #ffdd77;
       border-radius: 10px;
     }
   </style>
 </head>
 <body>
   <h2>填写你的魔法身份</h2>
   <input id="name" placeholder="你的昵称">
   <br>
   <input id="info" placeholder="留下你的简介">
   <br>
   <button onclick="saveUser()">保存并前往留言厅</button>
   <script>
     function saveUser() {
       const name = document.getElementById("name").value;
       const info = document.getElementById("info").value;
       if (!name) return alert("请填写昵称！");
       localStorage.setItem("userName", name);
       localStorage.setItem("userInfo", info);
       location.href = "message.html";
     }
   </script>
 </body>
 </html>
