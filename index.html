<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>尼克尼克魔法学校</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #111827;
      color: #e5e7eb;
      font-family: sans-serif;
      padding: 40px 20px;
    }
    .box {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
      background: #1f2937;
      border-radius: 16px;
    }
    h1 {
      color: #fbbf24;
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    button {
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #1d4ed8;
    }
    .list {
      margin-top: 16px;
    }
    .list div {
      padding: 6px 0;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>尼克尼克魔法学校 🪄</h1>

    <!-- 登录区域 -->
    <div id="login-area">
      <input id="nick" placeholder="输入你的魔法昵称">
      <br>
      <button id="loginBtn">进入魔法学院</button>
    </div>

    <!-- 登录成功后显示 -->
    <div id="info-area" style="display: none;">
      <p>欢迎，<span id="myName"></span>！</p >
      <h3>学院成员：</h3>
      <div id="userList" class="list"></div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    // ========= 这里填你的信息 =========
    const SUPABASE_URL = "https://ghgqjeiajnsnedmvtazw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_tAsFkD09uLteBgLzJ_3_8A_gZEXr5hI";
    // =====================================

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById("loginBtn").onclick = async () => {
      const nickInput = document.getElementById("nick");
      const nick = nickInput.value.trim();

      if (!nick) {
        alert("请填昵称！");
        return;
      }

      try {
        await supabase.from("all_users").upsert({ nickname: nick });

        document.getElementById("login-area").style.display = "none";
        document.getElementById("info-area").style.display = "block";
        document.getElementById("myName").innerText = nick;

        loadUsers();
      } catch (err) {
        alert("魔法通道出错啦：" + err.message);
      }
    };

    async function loadUsers() {
      const { data, error } = await supabase.from("all_users").select("nickname");
      if (error) {
        alert("读取名单失败：" + error.message);
        return;
      }
      const html = data.map(u => `<div>✨ ${u.nickname}</div>`).join("");
      document.getElementById("userList").innerHTML = html;
    }
  </script>
</body>
</html>
